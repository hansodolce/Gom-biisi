<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gom-biisi</title>
<meta name="description" content="Gom-biisi : traitement de texte léger avec interface en mooré (Burkina Faso).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{
  --chrome:#2b579a; --chrome-2:#244b85; --chrome-ink:#ffffff; --chrome-ink-2:#dce6f4;
  --file:#1e6e45; --file-2:#185a38;
  --ribbon:#f5f5f4; --ribbon-line:#dcdcd9; --ribbon-ink:#262626; --ribbon-ink-2:#5c5c5c;
  --hover:#e4e8ef; --active:#cfdcef; --active-line:#7a9cd3;
  --menubar:#f8f8f7; --menubar-ink:#1f1f1f;
  --work:#e9e9e7; --status:#f3f3f2; --status-ink:#444;
  --pane:#fbfbfa; --pane-line:#e0e0dd;
  --page:#ffffff; --page-ink:#111111; --page-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04);
  --accent:#2b579a; --accent-ink:#fff; --gold:#a8660b;
  --dialog:#ffffff; --dialog-ink:#1c1c1c; --scrim:rgba(20,24,32,.42);
  --hl-find:#ffe066; --hl-current:#ff9f40;
  --ui:'Noto Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --docfont:'Times New Roman',Tinos,'Noto Serif',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --chrome:#1d3a66; --chrome-2:#18304f; --chrome-ink:#f2f5fa; --chrome-ink-2:#b9c7de;
    --file:#1b5c3b; --file-2:#154a2f;
    --ribbon:#262626; --ribbon-line:#3a3a3a; --ribbon-ink:#ececec; --ribbon-ink-2:#a8a8a8;
    --hover:#34383f; --active:#2f4260; --active-line:#5c82c0;
    --menubar:#1c1c1c; --menubar-ink:#e8e8e8;
    --work:#141414; --status:#1f1f1f; --status-ink:#c4c4c4;
    --pane:#1f1f1f; --pane-line:#353535;
    --page-shadow:0 1px 4px rgba(0,0,0,.6);
    --accent:#5c8ad6; --accent-ink:#0b1320; --gold:#e0a650;
    --dialog:#262626; --dialog-ink:#eee; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome:#1d3a66; --chrome-2:#18304f; --chrome-ink:#f2f5fa; --chrome-ink-2:#b9c7de;
  --file:#1b5c3b; --file-2:#154a2f;
  --ribbon:#262626; --ribbon-line:#3a3a3a; --ribbon-ink:#ececec; --ribbon-ink-2:#a8a8a8;
  --hover:#34383f; --active:#2f4260; --active-line:#5c82c0;
  --menubar:#1c1c1c; --menubar-ink:#e8e8e8;
  --work:#141414; --status:#1f1f1f; --status-ink:#c4c4c4;
  --pane:#1f1f1f; --pane-line:#353535;
  --page-shadow:0 1px 4px rgba(0,0,0,.6);
  --accent:#5c8ad6; --accent-ink:#0b1320; --gold:#e0a650;
  --dialog:#262626; --dialog-ink:#eee; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--work);color:var(--ribbon-ink);font:13px/1.35 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{display:grid;grid-template-rows:auto auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}

/* Barre de menus */
#menubar{display:flex;align-items:center;gap:2px;background:var(--menubar);color:var(--menubar-ink);padding:2px 10px;border-bottom:1px solid var(--ribbon-line);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
#menubar .mb{border:0;background:none;padding:4px 8px;border-radius:5px}
#menubar .mb:hover,#menubar .mb[aria-expanded="true"]{background:var(--hover)}
#menubar .mb.brand{font-weight:700}
#clock{margin-left:auto;padding-left:16px;color:var(--ribbon-ink-2);font-variant-numeric:tabular-nums}

/* Barre de titre */
#titlebar{display:flex;align-items:center;gap:6px;background:var(--chrome);color:var(--chrome-ink);padding:5px 10px;min-height:40px}
.tb{display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:inherit;width:30px;height:30px;border-radius:5px}
.tb:hover{background:rgba(255,255,255,.14)}
.tb[aria-pressed="true"]{background:rgba(255,255,255,.22)}
#doctitle{flex:1;display:flex;justify-content:center;min-width:0}
#doctitle button{border:0;background:none;color:inherit;font-weight:600;display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:5px;max-width:100%;overflow:hidden}
#doctitle button:hover{background:rgba(255,255,255,.14)}
#doctitle .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docico{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:3px;background:#fff;color:var(--chrome);font:700 10px var(--ui);flex:none}
#searchwrap{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border-radius:6px;padding:0 6px;height:30px;width:min(330px,34vw)}
#searchwrap input{background:none;border:0;outline:0;color:var(--chrome-ink);width:100%;min-width:70px}
#searchwrap input::placeholder{color:var(--chrome-ink-2)}
#searchnav{display:flex;align-items:center;gap:2px;color:var(--chrome-ink-2);font-variant-numeric:tabular-nums}
#searchcount{min-width:30px;text-align:center}
#sharebtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;padding:5px 10px;border-radius:5px}
#sharebtn:hover{background:rgba(255,255,255,.14)}

/* Onglets */
#tabs{display:flex;align-items:flex-end;gap:2px;background:var(--chrome);padding:0 10px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--chrome-ink);padding:7px 13px 8px;border-radius:6px 6px 0 0;white-space:nowrap;font-weight:500}
.tab:hover{background:rgba(255,255,255,.12)}
.tab[aria-selected="true"]{background:var(--ribbon);color:var(--accent);font-weight:600}
.tab.file{background:var(--file);color:#fff;font-weight:700;letter-spacing:.04em;margin-right:4px}
.tab.file:hover{background:var(--file-2)}
#ribbontoggle{margin-left:auto;align-self:center}

/* Ruban */
#ribbon{background:var(--ribbon);border-bottom:1px solid var(--ribbon-line);overflow-x:auto;scrollbar-width:thin}
#ribbon.collapsed{display:none}
.panel{display:flex;align-items:stretch;min-height:92px;padding:6px 8px 4px;width:max-content}
.panel[hidden]{display:none}
.grp{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--ribbon-line)}
.grp:last-child{border-right:0}
.grp .body{display:flex;align-items:center;gap:6px;flex:1}
.grp .cap{text-align:center;color:var(--ribbon-ink-2);font-size:11px;padding-top:3px;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:3px}
.seg{display:inline-flex;border:1px solid var(--ribbon-line);border-radius:5px;background:var(--ribbon)}
.ortho{display:flex;margin:0 0 10px}.ortho button{flex:1;border:0;background:none;padding:5px 6px;font-size:12px;color:inherit;border-radius:4px}.ortho button[aria-pressed="true"]{background:var(--active);font-weight:600}
.seg>.rb{border-radius:0}
.seg>.rb:first-child{border-radius:4px 0 0 4px}
.seg>.rb:last-child{border-radius:0 4px 4px 0}
.rb{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:28px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:5px;background:none;color:var(--ribbon-ink);white-space:nowrap}
.rb:hover{background:var(--hover)}
.rb.on{background:var(--active);border-color:var(--active-line)}
.rb.big{flex-direction:column;height:74px;min-width:54px;padding:4px 6px;gap:3px;font-size:12px}
.rb.big svg.i{width:28px;height:28px;stroke-width:1.5}
.rb.big .glyph{font-size:24px;line-height:28px}
.rb .glyph{font-family:var(--docfont);font-size:15px;line-height:1}
.rb .caret{font-size:9px;color:var(--ribbon-ink-2)}
.rb.split{padding:0 2px 0 6px}
.swatch{display:block;width:16px;height:3px;margin-top:1px}
.colorbtn{display:inline-flex;flex-direction:column;align-items:center}
select.rsel,input.rsel{height:28px;border:1px solid var(--ribbon-line);border-radius:5px;background:var(--dialog);padding:0 6px}
#fontname{width:150px}
#fontsize{width:58px}
.gallery{display:flex;align-items:stretch;border:1px solid var(--ribbon-line);border-radius:5px;background:var(--dialog);overflow:hidden}
.sty{display:flex;flex-direction:column;align-items:center;justify-content:space-between;border:0;border-right:1px solid var(--ribbon-line);background:none;width:74px;height:66px;padding:6px 3px 4px;color:var(--ribbon-ink)}
.sty:last-child{border-right:0}
.sty:hover{background:var(--hover)}
.sty.on{outline:2px solid var(--active-line);outline-offset:-2px;background:var(--active)}
.sty .pv{font-family:var(--docfont);white-space:nowrap;overflow:hidden;max-width:100%}
.sty .lb{font-size:11px;color:var(--ribbon-ink-2);white-space:nowrap;overflow:hidden;max-width:100%}
.note{align-self:center;max-width:340px;color:var(--ribbon-ink-2);padding:0 12px}

/* Zone principale */
#main{position:relative;display:flex;min-height:0}
#nav{width:280px;flex:none;background:var(--pane);border-right:1px solid var(--pane-line);display:flex;flex-direction:column;min-height:0}
#nav[hidden]{display:none}
#nav header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;font-weight:600;font-size:14px}
.navtabs{display:grid;grid-template-columns:repeat(3,1fr);margin:0 12px 10px;border:1px solid var(--pane-line);border-radius:6px;overflow:hidden}
.navtabs button{border:0;background:none;padding:6px 4px}
.navtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
#navbody{flex:1;overflow:auto;padding:0 12px 12px}
.navlist{list-style:none;margin:0;padding:0}
.navlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px}
.navlist button:hover{background:var(--hover)}
.navlist .h2{padding-left:20px}
.navlist .h3{padding-left:32px}
.muted{color:var(--ribbon-ink-2)}
.gl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:6px}
.gl:hover{background:var(--hover)}
.gl .mo{font-weight:600}
.gl .fr{grid-column:1;color:var(--ribbon-ink-2);font-size:12px}
.glcat{margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ribbon-ink-2)}
.gl .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:2px;opacity:.25}
.gl:hover .acts,.gl:focus-within .acts{opacity:1}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;line-height:1.45}
.res:hover{background:var(--hover)}
.res mark{background:var(--hl-find);color:#000}
#glfilter{width:100%;height:30px;border:1px solid var(--pane-line);border-radius:6px;background:var(--dialog);padding:0 8px;margin-bottom:8px}

#work{position:relative;flex:1;overflow:auto;min-width:0}
#zoomer{padding:18px 28px 40px;width:max-content;min-width:100%}
#ruler{position:sticky;top:0;z-index:3;height:22px;margin:0 auto 10px}
#ruler canvas{display:block}
#pages{position:relative;margin:0 auto}
#sheets{position:absolute;inset:0;pointer-events:none}
.sheet{position:absolute;top:0;background:var(--page);box-shadow:var(--page-shadow)}
.sheet .hdr,.sheet .ftr{position:absolute;left:0;right:0;text-align:center;font:11px var(--docfont);color:#8a8a8a}
.sheet .hdr{top:34px}
.sheet .ftr{bottom:30px}
#doc{position:relative;z-index:1;outline:0;color:var(--page-ink);font:12pt/1.5 var(--docfont);column-fill:auto;box-sizing:content-box;overflow:hidden;caret-color:#000;text-align:left;word-wrap:break-word;hyphens:manual}
#doc.ro{caret-color:transparent}
#doc>*:first-child{margin-top:0}
#doc p{margin:0 0 8pt}
#doc p.gb-nospace{margin:0}
#doc.spacing-none p{margin:0}
#doc.spacing-wide p{margin:0 0 14pt}
#doc h1{font-size:14pt;font-weight:700;text-align:center;text-transform:uppercase;margin:6pt 0 12pt;break-after:avoid}
#doc h1.gb-title{font-size:24pt;text-transform:none;font-weight:400;letter-spacing:.01em;border-bottom:1px solid #9bb0d0;padding-bottom:4pt;text-align:left}
#doc h2{font-size:13pt;font-weight:700;margin:12pt 0 6pt;break-after:avoid;color:#1f3864}
#doc h3{font-size:12pt;font-weight:700;font-style:italic;margin:10pt 0 4pt;break-after:avoid}
#doc p.gb-subtitle{font-size:13pt;color:#5a5a5a;font-style:italic}
#doc blockquote{margin:6pt 1cm 10pt;font-style:italic;color:#333;border-left:3px solid #c7d3e6;padding-left:10pt}
#doc ul,#doc ol{margin:0 0 8pt;padding-left:1.1cm}
#doc table{border-collapse:collapse;width:100%;margin:6pt 0 10pt;break-inside:avoid}
#doc td,#doc th{border:1px solid #777;padding:3pt 6pt;vertical-align:top;min-width:1.5cm}
#doc th{background:#eef2f8}
#doc img{max-width:100%;height:auto;break-inside:avoid}
#doc img.gb-selimg{outline:2px solid #2b579a;outline-offset:2px}
#doc a{color:#1a4f9c}
#doc hr.gb-saut{border:0;border-top:1px dashed transparent;height:0;margin:0;break-after:column}
#doc.show-marks hr.gb-saut{border-top-color:#8aa;height:1px}
#doc.show-marks p::after,#doc.show-marks h1::after,#doc.show-marks h2::after,#doc.show-marks h3::after,#doc.show-marks li::after{content:"¶";color:#7c9bbd;font-weight:400;margin-left:2px}
#doc .gb-comment{background:#fff2b3;border-bottom:2px solid #e3b400;cursor:help}
#doc sup.gb-fnref{color:#1a4f9c;font-size:.7em}
#doc .gb-footnotes{border-top:1px solid #999;margin-top:14pt;padding-top:6pt;font-size:10pt;width:45%;min-width:5cm}
#doc .gb-footnotes p{margin:0 0 3pt}
#doc p.gb-caption{font-size:10pt;font-style:italic;text-align:center;color:#333}
#doc .gb-textbox{border:1px solid #6b7c93;padding:6pt 8pt;margin:6pt 0 10pt;break-inside:avoid}
#doc .gb-eq{font-family:'Cambria Math','Tinos',serif;font-style:italic;padding:0 2px;background:#f2f5fb}
#doc .gb-toc{border:1px solid #d9e0ea;padding:8pt 10pt;margin:0 0 12pt;cursor:pointer;break-inside:avoid}
#doc .gb-toc .t{font-weight:700;margin-bottom:6pt}
#doc .gb-toc .e{display:flex;gap:6px}
#doc .gb-toc .e .d{flex:1;border-bottom:1px dotted #888;transform:translateY(-4px)}
#doc .gb-toc .e.l2{padding-left:14pt}
#doc .gb-toc .e.l3{padding-left:28pt}
::highlight(gb-find){background-color:var(--hl-find);color:#000}
::highlight(gb-current){background-color:var(--hl-current);color:#000}

#imgbar{position:absolute;z-index:6;display:flex;gap:2px;background:var(--dialog);color:var(--dialog-ink);border:1px solid var(--ribbon-line);border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:3px}
#imgbar[hidden]{display:none}

/* Coulisses KÍBÁRÈ */
#backstage{position:absolute;inset:0;z-index:20;display:flex;background:var(--work)}
#backstage[hidden]{display:none}
#bsnav{width:230px;flex:none;background:var(--file);color:#fff;display:flex;flex-direction:column;padding:16px 0;overflow:auto}
#bsnav .back{border:0;background:none;color:#fff;text-align:left;padding:6px 18px;opacity:.9}
#bsnav .back:hover{opacity:1;text-decoration:underline}
#bsnav .brand{padding:14px 18px 14px}
#bsnav .brand b{display:block;font-size:17px;letter-spacing:.03em}
#bsnav .brand small{opacity:.8}
.bsitem{display:block;width:100%;border:0;background:none;color:#fff;text-align:left;padding:9px 18px}
.bsitem b{display:block;font-weight:600}
.bsitem small{opacity:.8;font-size:11px}
.bsitem:hover{background:rgba(255,255,255,.1)}
.bsitem[aria-current="true"]{background:rgba(255,255,255,.18)}
#bsnav hr{border:0;border-top:1px solid rgba(255,255,255,.25);margin:10px 18px}
#bsmain{flex:1;overflow:auto;padding:26px 30px;color:var(--ribbon-ink)}
#bsmain h2{margin:0;font-size:24px;font-weight:600;text-wrap:balance}
#bsmain .sub{color:var(--ribbon-ink-2);margin:4px 0 20px}
.card{background:var(--dialog);border:1px solid var(--ribbon-line);border-radius:10px;padding:16px 18px;max-width:780px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--file)}
:root[data-theme="dark"] .card h3{color:#6fcf9b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h3{color:#6fcf9b}}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ribbon-ink-2)}
.kv dd{margin:0}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick button{border:1px solid var(--ribbon-line);background:var(--dialog);border-radius:8px;padding:10px 12px;text-align:left}
.quick button:hover{border-color:var(--active-line);background:var(--hover)}
.quick b{display:block;font-weight:600}
.quick small{color:var(--ribbon-ink-2)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field input,.field textarea,.field select{border:1px solid var(--ribbon-line);border-radius:6px;background:var(--dialog);padding:7px 9px}
.doclist{list-style:none;padding:0;margin:0}
.doclist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ribbon-line)}
.doclist li:last-child{border-bottom:0}
.doclist .t{flex:1;min-width:0}
.doclist .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--ribbon-line);background:var(--dialog);border-radius:6px;padding:6px 12px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#b3261e}
.switch{display:flex;align-items:center;gap:8px;margin:6px 0}

/* Barre d'état */
#status{display:flex;align-items:center;gap:14px;background:var(--status);color:var(--status-ink);border-top:1px solid var(--ribbon-line);padding:3px 12px calc(3px + env(safe-area-inset-bottom,0px));white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-variant-numeric:tabular-nums;font-size:12px}
#status::-webkit-scrollbar{display:none}
#status .sp{margin-left:auto}
#status button.sb{border:0;background:none;padding:3px 5px;border-radius:4px;display:inline-flex;align-items:center;gap:5px}
#status button.sb:hover{background:var(--hover)}
#status button.sb.on{background:var(--active)}
#zoomrange{width:110px;accent-color:var(--accent)}
#savestate.dirty{color:var(--gold)}

/* Menus déroulants, bulles, dialogues */
.menu{position:fixed;z-index:50;min-width:250px;background:var(--dialog);color:var(--dialog-ink);border:1px solid var(--ribbon-line);border-radius:9px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:5px;max-height:80vh;overflow:auto}
.menu button{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 12px;border-radius:5px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
.menu .mo{font-weight:500}
.menu .fr{color:var(--ribbon-ink-2);font-size:11.5px;margin-left:auto;padding-left:12px}
.menu .only{flex:1}
.menu hr{border:0;border-top:1px solid var(--ribbon-line);margin:5px 4px}
.menu .chk::before{content:"✓";display:inline-block;width:14px}
.menu .unchk::before{content:"";display:inline-block;width:14px}
.pal{display:grid;grid-template-columns:repeat(7,22px);gap:5px;padding:8px}
.pal button{width:22px;height:22px;padding:0;border:1px solid rgba(0,0,0,.25);border-radius:4px}
#tip{position:fixed;z-index:60;max-width:290px;background:var(--dialog);color:var(--dialog-ink);border:1px solid var(--ribbon-line);border-radius:9px;box-shadow:0 10px 26px rgba(0,0,0,.18);padding:10px 12px;pointer-events:none;font-size:12px;line-height:1.45}
#tip[hidden]{display:none}
#tip b{display:block;font-size:13px;margin-bottom:3px}
#tip .mo{color:var(--gold);font-weight:700}
#tip .g{border-top:1px dashed var(--ribbon-line);margin-top:7px;padding-top:6px;color:var(--ribbon-ink-2)}
#tip .g b{display:inline;font-size:12px;color:var(--gold)}
#scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px}
#scrim[hidden]{display:none}
.dlg{background:var(--dialog);color:var(--dialog-ink);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(460px,100%);max-height:88vh;display:flex;flex-direction:column}
.dlg h2{margin:0;padding:16px 18px 6px;font-size:16px}
.dlg .db{padding:6px 18px 12px;overflow:auto}
.dlg .da{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--ribbon-line)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.chars button{height:38px;border:1px solid var(--ribbon-line);border-radius:6px;background:var(--dialog);font:18px var(--docfont)}
.chars button:hover{background:var(--hover)}
.tgrid{display:grid;grid-template-columns:repeat(8,22px);gap:3px;margin:6px 0}
.tgrid span{width:22px;height:22px;border:1px solid var(--ribbon-line);border-radius:3px}
.tgrid span.on{background:var(--active);border-color:var(--active-line)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:80;background:#222;color:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
textarea.code{width:100%;height:180px;font:12px ui-monospace,monospace}

@media (max-width:760px){
  #searchwrap{width:auto;flex:1;min-width:0}
  #searchwrap input{min-width:0}
  #q-print,#q-ro{display:none}
  #doctitle{display:none}
  #sharebtn span:not(#shareico){display:none}
  #nav{position:absolute;z-index:8;inset:0 auto 0 0;width:min(300px,86vw);box-shadow:6px 0 24px rgba(0,0,0,.2)}
  #zoomer{padding:12px 12px 30px}
  #bsnav{width:170px}
  #bsmain{padding:18px 16px}
  .kv{grid-template-columns:1fr}
  .kv dd{margin-bottom:6px}
  #status .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{
  @page{size:A4;margin:2.5cm}
  body{overflow:visible;background:#fff}
  #app{display:block;height:auto}
  #menubar,#titlebar,#tabs,#ribbon,#nav,#status,#ruler,#sheets,#backstage,#imgbar,#tip,#toast,#scrim{display:none!important}
  #main,#work{display:block;overflow:visible}
  #zoomer{padding:0;zoom:1!important;width:auto}
  #doc{columns:auto!important;column-count:auto!important;width:auto!important;height:auto!important;padding:0!important;overflow:visible}
  #doc hr.gb-saut{break-after:page;border:0}
  #doc .gb-comment{background:none;border:0}
}
</style>

<body>

<div id="app">
  <nav id="menubar" aria-label="Menus"></nav>

  <header id="titlebar">
    <button class="tb" id="q-nav" data-tip="nav" aria-label="Volet de navigation" aria-pressed="false"></button>
    <button class="tb" id="q-save" data-tip="save" aria-label="Enregistrer"></button>
    <button class="tb" id="q-undo" data-tip="undo" aria-label="Annuler"></button>
    <button class="tb" id="q-redo" data-tip="redo" aria-label="Rétablir"></button>
    <button class="tb" id="q-print" data-tip="print" aria-label="Imprimer"></button>
    <button class="tb" id="q-ro" data-tip="readonly" aria-label="Lecture seule" aria-pressed="false"></button>
    <div id="doctitle"><button id="titlebtn" data-tip="rename"><span class="docico">a</span><span class="nm" id="titletext"></span></button></div>
    <label id="searchwrap"><span id="searchico"></span><span class="sr">Rechercher dans le document</span>
      <input id="search" type="search" placeholder="Rechercher dans le document" autocomplete="off">
      <span id="searchnav"><button class="tb" id="s-prev" aria-label="Résultat précédent" style="width:22px;height:22px">▲</button><button class="tb" id="s-next" aria-label="Résultat suivant" style="width:22px;height:22px">▼</button><span id="searchcount"></span></span>
    </label>
    <button id="sharebtn" data-tip="share"><span id="shareico"></span><span data-k="share">pʋɩ</span></button>
  </header>

  <div id="tabs" role="tablist" aria-label="Onglets du ruban"></div>
  <div id="ribbon"></div>

  <div id="main">
    <aside id="nav" hidden aria-label="Volet de navigation">
      <header><span>Volet de navigation</span><button class="tb" id="navclose" aria-label="Fermer le volet" style="color:inherit"></button></header>
      <div class="navtabs" role="tablist">
        <button role="tab" data-nt="titres" aria-selected="true">Titres</button>
        <button role="tab" data-nt="resultats" aria-selected="false">Résultats</button>
        <button role="tab" data-nt="glossaire" aria-selected="false">Glossaire</button>
      </div>
      <div id="navbody"></div>
    </aside>

    <div id="work">
      <div id="zoomer">
        <div id="ruler"><canvas id="rulercv" height="22"></canvas></div>
        <div id="pages">
          <div id="sheets"></div>
          <div id="doc" contenteditable="true" spellcheck="false" lang="fr" aria-label="Document" role="textbox" aria-multiline="true"></div>
        </div>
      </div>
      <div id="imgbar" hidden></div>
    </div>

    <section id="backstage" hidden aria-label="KÍBÁRÈ">
      <nav id="bsnav"></nav>
      <div id="bsmain"></div>
    </section>
  </div>

  <footer id="status">
    <span id="st-page">Page 1 sur 1</span>
    <span id="st-words">0 mots</span>
    <span id="st-chars" class="hide-sm">0 caractères</span>
    <button class="sb" id="st-lang" data-tip="language"><span id="st-langico"></span><span>Mooré (Burkina Faso)</span></button>
    <span id="savestate" class="hide-sm"></span>
    <span class="sp"></span>
    <button class="sb" id="st-one" data-tip="onepage" aria-label="Une page"></button>
    <button class="sb" id="st-two" data-tip="twopages" aria-label="Plusieurs pages"></button>
    <button class="sb" id="st-zout" aria-label="Zoom arrière">−</button>
    <input id="zoomrange" type="range" min="30" max="200" step="5" value="100" aria-label="Zoom">
    <button class="sb" id="st-zin" aria-label="Zoom avant">+</button>
    <button class="sb" id="st-zval" aria-label="Zoom à 100 %">100 %</button>
  </footer>
</div>

<div id="tip" hidden role="tooltip"></div>
<div id="scrim" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="f-image" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<input type="file" id="f-open" accept=".html,.htm,.txt,text/html,text/plain" hidden>

/* ---------- Menus déroulants et palettes ---------- */
let openMenuEl = null, openMenuAnchor = null;
function closeMenu() {
  if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
  if (openMenuAnchor) { openMenuAnchor.setAttribute('aria-expanded', 'false'); openMenuAnchor = null; }
}
function placeMenu(m, anchor) {
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  let x = Math.min(r.left, innerWidth - w - 8), y = r.bottom + 4;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 4);
  m.style.left = Math.max(8, x) + 'px'; m.style.top = y + 'px';
}
function openMenu(anchor, items) {
  const again = openMenuAnchor === anchor;
  closeMenu();
  if (again) return;
  saveSel();
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    if (it === '-') { m.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem'); b.title = it.fr.replace(/…$/, '');
    const moL = mo(it.k);
    const chk = it.chk ? (it.chk() ? 'chk' : 'unchk') : '';
    b.innerHTML = moL
      ? `<span class="only mo ${chk}">${esc(moL + (it.suf || ''))}</span>${it.sub ? '<span class="fr">▸</span>' : ''}`
      : `<span class="only ${chk}">${esc(it.fr)}</span>${it.sub ? '<span class="fr">▸</span>' : ''}`;
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { const a = anchor; closeMenu(); it.run(a); });
    m.appendChild(b);
  });
  placeMenu(m, anchor);
  openMenuEl = m; openMenuAnchor = anchor; anchor.setAttribute('aria-expanded', 'true');
}
function openPalette(anchor, colors, pick) {
  const again = openMenuAnchor === anchor;
  closeMenu();
  if (again) return;
  saveSel();
  const m = document.createElement('div');
  m.className = 'menu'; m.style.minWidth = '0';
  m.innerHTML = `<div class="pal">${colors.map(c => `<button data-c="${c}" title="${c === 'transparent' ? 'Aucune couleur' : c}" style="background:${c === 'transparent' ? 'linear-gradient(45deg,#fff 45%,#d13438 45% 55%,#fff 55%)' : c}"></button>`).join('')}</div>`;
  m.addEventListener('mousedown', e => e.preventDefault());
  m.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; closeMenu(); pick(b.dataset.c); });
  placeMenu(m, anchor);
  openMenuEl = m; openMenuAnchor = anchor;
}
function paintSwatches() {
  const h = $('#sw-hilite'), c = $('#sw-color');
  if (h) h.style.background = ui.hilite || '#ffff00';
  if (c) c.style.background = ui.color || '#c00000';
}

/* ---------- Bulles d'aide (libellé mooré + équivalent français) ---------- */
let tipTimer = null;
function tipHtml(key) {
  let fr, k, g, keys;
  if (key.startsWith('style:')) { const s = STYLES.find(x => x.id === key.slice(6)); fr = 'Style « ' + s.fr + ' »'; g = 'styles'; k = 'st_' + s.id; }
  else if (key.startsWith('tab:')) { const t = TABS.find(x => x[0] === key.slice(4)); fr = 'Onglet ' + t[2]; k = t[1]; }
  else if (key.startsWith('menu:')) { k = key.slice(5); fr = 'Menu ' + GL[k].fr; }
  else if (key === 'fontname') { fr = 'Police'; g = 'font'; k = 'font'; }
  else if (key === 'fontsize') { fr = 'Taille de police'; g = 'font'; k = 'fontsize'; }
  else if (key === 'ribbontoggle') { fr = ui.ribbon ? 'Réduire le ruban' : 'Afficher le ruban'; }
  else { const c = C[key]; if (!c) return ''; fr = c.fr.replace(/…$/, ''); k = c.k; g = c.g; keys = c.key; }
  const m = mo(k);
  let h = `<b>${esc(fr)}${keys ? ` <span class="muted" style="font-weight:400">(${esc(keys)})</span>` : ''}</b>`;
  h += m ? `<div>Mooré : <span class="mo">${esc(m)}</span></div>` : `<div class="muted">${NO_MO}</div>`;
  const n = k && GL[k] && GL[k].note;
  if (k && GL[k] && GL[k].def && m) h += `<div class="muted" lang="mos">${esc(GL[k].def)}</div>`;
  if (n && m && (n[1] || n[0])) h += `<div class="muted">${n[1] ? `Sens littéral : « ${esc(n[1])} »` : `/ ${esc(n[0])} /`}</div>`;
  if (g) {
    const gm = mo(g), gf = GL[g] ? GL[g].fr.toLowerCase() : g;
    h += `<div class="g">Groupe : ${gm ? `<b>${esc(gm)}</b> « ${esc(gf)} »` : esc(gf)}</div>`;
  }
  return h;
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  clearTimeout(tipTimer);
  const tip = $('#tip');
  if (!el || !el.dataset.tip || openMenuEl) { tip.hidden = true; return; }
  tipTimer = setTimeout(() => {
    const h = tipHtml(el.dataset.tip);
    if (!h) return;
    tip.innerHTML = h; tip.hidden = false;
    const r = el.getBoundingClientRect();
    const x = Math.min(Math.max(8, r.left), innerWidth - tip.offsetWidth - 8);
    let y = r.bottom + 8;
    if (y + tip.offsetHeight > innerHeight - 8) y = r.top - tip.offsetHeight - 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }, 450);
});
document.addEventListener('mousedown', () => { clearTimeout(tipTimer); $('#tip').hidden = true; }, true);

/* ---------- Sélection et commandes d'édition ---------- */
function inDoc(node) { return node && (node === doc || doc.contains(node)); }
function saveSel() {
  const s = getSelection();
  if (s.rangeCount && inDoc(s.getRangeAt(0).commonAncestorContainer)) savedRange = s.getRangeAt(0).cloneRange();
}
function restoreSel() {
  doc.focus({ preventScroll: true });
  const s = getSelection();
  if (savedRange && inDoc(savedRange.commonAncestorContainer)) { s.removeAllRanges(); s.addRange(savedRange); }
  else if (!s.rangeCount || !inDoc(s.getRangeAt(0).commonAncestorContainer)) {
    const r = document.createRange(); r.selectNodeContents(doc); r.collapse(false); s.removeAllRanges(); s.addRange(r);

function tableOp(op) {
  if (!guard()) return;
  const el = anchorEl();
  const cell = el && el.closest('td,th');
  if (!cell || !doc.contains(cell)) { toast('Placez d’abord le curseur dans un tableau.'); return; }
  const row = cell.parentElement, table = cell.closest('table'), idx = [...row.children].indexOf(cell);
  const blank = t => { const c = document.createElement(t); c.innerHTML = '<br>'; return c; };
  if (op === 'rowabove' || op === 'rowbelow') {
    const nr = document.createElement('tr');
    [...row.children].forEach(() => nr.appendChild(blank('td')));
    row.parentElement.insertBefore(nr, op === 'rowabove' ? row : row.nextSibling);
  } else if (op === 'colleft' || op === 'colright') {
    $$('tr', table).forEach(tr => { const ref = tr.children[idx]; const nc = blank(ref && ref.tagName === 'TH' ? 'th' : 'td'); tr.insertBefore(nc, op === 'colleft' ? ref : ref ? ref.nextSibling : null); });
  } else if (op === 'delrow') {
    if ($$('tr', table).length === 1) table.remove(); else row.remove();
  } else if (op === 'delcol') {
    if (row.children.length === 1) table.remove(); else $$('tr', table).forEach(tr => tr.children[idx] && tr.children[idx].remove());
  } else if (op === 'deltable') table.remove();
  changed();
}

const SAMPLE = `<h1>Introduction</h1>
<p style="text-align:justify;text-indent:1cm">L’extinction des langues est un phénomène mondial. Selon les études menées par l’UNESCO en 2003, une langue s’éteint tous les 14 jours. Dans le contexte des langues africaines, on constate que leur vitalité diminue au fil des années et cela est due à la mondialisation, l’urbanisation, la scolarisation dans les langues dominantes telles que le français, l’anglais, l’espagnol et les politiques linguistiques nationales. Ces phénomènes contribuent malheureusement à accélérer la disparition de nombreuses langues qui entraînent avec elles non seulement la perte du patrimoine linguistique mais aussi la perte des savoirs culturels en général. De fait, il est évident que lorsqu’une langue meurt, elle ne meurt pas seule, elle entraîne avec elle toute l’histoire qui se rattache au peuple qui la pratique. Selon la théorie de la relativité linguistique de Sapir-Whorf (1929), la langue est le découpage de la vision du monde que se fait chaque peuple du monde. En effet la langue est la dimension la plus visible, la plus parlante de la culture. Le développement d’une société est tributaire de la langue car elle permet la transmission de savoirs techniques et technologiques. Malheureusement en Afrique, ces savoirs sont généralement transmis dans d’autres langues, en l’occurrence les langues indo-européennes et le mooré ne reste pas en marge de cette déperdition. Conscient de ce fait, le Burkina Faso, dans sa nouvelle politique éducative a pris la résolution d’accorder du crédit aux langues locales, avec l’introduction de différents projets de loi au début des années 2000.</p>
<p style="text-align:justify;text-indent:1cm">En outre, peu de travaux de description linguistique ont porté sur la terminologie dans les domaines technologiques en mooré, ce qui rend parfois la tâche difficile aux locuteurs quant à l’expression de certains besoins communicationnels. Cela a pour conséquence de retarder la transmission des savoirs scientifiques dans les sphères éducatives. Parlant du domaine de la santé, Hien Amélie dira : « De plus en plus de travaux s’effectuent en terminologie des langues africaines mais, à notre connaissance, très peu d’entre eux ont proposé une méthode et aucun ne décrit, dans le domaine de la santé. »</p>
<h2>Quelques termes de l’interface en mooré</h2>
<ul><li><b>sɩ̃ŋrè</b> : Accueil</li><li><b>paasgo</b> : Insertion</li><li><b>dʋgélè</b> : Coller</li><li><b>nɩ̃ŋè</b> : Enregistrer</li><li><b>jíís sébra zúgù</b> : Imprimer</li></ul>
<p>Survolez un bouton du ruban pour voir son nom en mooré et son équivalent français. Ce texte d’exemple peut être effacé librement.</p>`;
